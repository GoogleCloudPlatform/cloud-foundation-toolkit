name: Release new CLI versions
on:
  push:
    branches:
      - "main"
    paths:
      - "cli/Makefile"
      - ".github/workflows/release-cli.yml"
env:
  CLI_BUCKET: gs://cft-cli
  RELEASE_URL: https://api.github.com/repos/GoogleCloudPlatform/cloud-foundation-toolkit/releases/latest

permissions: {}

concurrency:
  group: '${{ github.workflow }}-${{ github.ref }}'
  cancel-in-progress: false

jobs:
  release-new-cli:
    name: Release new CLI versions
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.repository == 'GoogleCloudPlatform/cloud-foundation-toolkit'

    permissions:
      contents: 'write'
      id-token: 'write'

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum

      - id: 'auth'
        name: 'Authenticate to Google Cloud'
        uses: 'google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093' # v3.0.0
        with:
          workload_identity_provider: '${{ secrets.GCP_WIF_PROVIDER }}'
          service_account: '${{ secrets.GCP_WIF_SA_EMAIL }}'

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          version: "410.0.0"

      # used by make release which runs gcloud alpha storage
      - name: Install gcloud alpha commands
        run: gcloud components install alpha

      - name: Retrieve last released version
        run: |-
          LAST_VERSION=$(curl --silent "$RELEASE_URL" | \
            jq --raw-output .tag_name)
          echo "LAST_VERSION=${LAST_VERSION}" >> $GITHUB_ENV

      - name: Build
        working-directory: ./cli
        run: |-
          make release
          chmod +x bin/*

      - name: Archive build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bin
          path: cli/bin

      - name: Retrieve current version
        working-directory: ./cli
        run: |-
          CURRENT_VERSION=$(./bin/cft-linux-amd64 version)
          echo "CURRENT_VERSION=${CURRENT_VERSION}" >> $GITHUB_ENV

      - name: Release new version
        if: env.LAST_VERSION != env.CURRENT_VERSION
        working-directory: ./cli
        run: |-
          make publish

      - name: Create Release and Upload Assets
        if: env.LAST_VERSION != env.CURRENT_VERSION
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |-
          gh release create "cli/${CURRENT_VERSION}" \
            ./cli/bin/cft-linux-amd64 \
            ./cli/bin/cft-darwin-amd64 \
            ./cli/bin/cft-windows-amd64 \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "CLI Release ${CURRENT_VERSION}" \
            --notes ""
