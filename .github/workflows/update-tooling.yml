name: Update Tooling
on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
  release:
    types: [released]
  push:
    branches:
      - "main"

env:
  TERRAFORM_URL: "https://api.github.com/repos/hashicorp/terraform/releases/latest"
  CLOUD_SDK_URL: "https://dl.google.com/dl/cloudsdk/channels/rapid/google-cloud-sdk.tar.gz"
  KPT_URL: "https://api.github.com/repos/kptdev/kpt/releases?per_page=100"
  CFT_CLI_URL: "https://api.github.com/repos/GoogleCloudPlatform/cloud-foundation-toolkit/releases"
  MODULE_SWAPPER_URL: "https://api.github.com/repos/GoogleCloudPlatform/cloud-foundation-toolkit/releases"
  TFLINT_BP_PLUGIN_URL: "https://api.github.com/repos/GoogleCloudPlatform/cloud-foundation-toolkit/releases"
  GATOR_MINOR: "3.17"
  GATOR_URL: "https://api.github.com/repos/open-policy-agent/gatekeeper/releases"
  GCRANE_URL: "https://api.github.com/repos/google/go-containerregistry/releases/latest"
  KUSTOMIZE_URL: "https://api.github.com/repos/kubernetes-sigs/kustomize/releases"
  TERRAGRUNT_URL: "https://api.github.com/repos/gruntwork-io/terragrunt/releases/latest"
  TFLINT_URL: "https://api.github.com/repos/terraform-linters/tflint/releases/latest"
  TERRAFORM_DOCS_URL: "https://api.github.com/repos/terraform-docs/terraform-docs/releases/latest"
  GOLANGCI_URL: "https://api.github.com/repos/golangci/golangci-lint/releases/latest"

permissions:
  contents: read # peter-evans/create-pull-request uses secrets.CFT_ROBOT_PAT

jobs:
  update-tools:
    runs-on: ubuntu-latest
    if: github.repository == 'GoogleCloudPlatform/cloud-foundation-toolkit'

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          persist-credentials: false
      - name: Update Tools
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh_curl() {
            local body
            if body=$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "$1"); then
              printf '%s\n' "$body"
            else
              echo "null"
            fi
          }
          PR_UPDATE_BODY=""
          newline=$'\n'
          VERSION_REGEX='^[0-9]+(\.[0-9]+){1,3}([+-][A-Za-z0-9.-]+)?$'
          tools=("TERRAFORM" "CLOUD_SDK" "CFT_CLI" "GATOR" "GCRANE" "KPT" "MODULE_SWAPPER" "KUSTOMIZE" "TERRAGRUNT" "TFLINT" "GOLANGCI" "TFLINT_BP_PLUGIN" "TERRAFORM_DOCS")

          for tool in "${tools[@]}"
          do
            # get current tool version from Makefile
            CURRENT_TOOL_VERSION=$(awk -v key="${tool}_VERSION" '{sub(/#.*/, "")} $1 == key && $2 == ":=" && NF == 3 {print $3; exit}' infra/build/Makefile)
            TOOL_URL="${tool}_URL"

            # get latest tool version from URL
            if [ "$tool" == "CLOUD_SDK" ]; then
              LATEST_TOOL_VERSION=$(curl -fsSL "${!TOOL_URL}" | tar --to-stdout -xzf - google-cloud-sdk/VERSION || true)
            elif [ "$tool" == "KPT" ]; then
              # get highest stable kpt semver release (vX.Y.Z) with published linux_amd64 tarball
              LATEST_TOOL_VERSION=$(gh_curl "${!TOOL_URL}" | jq --raw-output '(if type == "array" then [ .[] | select((.prerelease | not) and (.draft | not) and ((.tag_name // null) | type == "string") and (.tag_name | test("^v[0-9]+[.][0-9]+[.][0-9]+$"))) | (.tag_name | ltrimstr("v")) as $ver | select([(.assets // [])[]?.name] | index("kpt_linux_amd64-" + $ver + ".tar.gz") != null) ] else [] end) | max_by(.tag_name | ltrimstr("v") | split(".") | map(tonumber)) | (.tag_name // empty) | select(type == "string") | ltrimstr("v")' || true)
            elif [ "$tool" == "CFT_CLI" ]; then
              # get latest CFT_CLI release
              LATEST_TOOL_VERSION=$(gh_curl "${!TOOL_URL}" | jq --raw-output 'if type == "array" then ([ .[] | select(((.name // null) | type == "string") and (.name | contains("CLI Release")) and ((.tag_name // null) | type == "string")) ][0].tag_name // empty) | ltrimstr("cli/v") else empty end' || true)
            elif [ "$tool" == "MODULE_SWAPPER" ]; then
              # get latest MODULE_SWAPPER release
              LATEST_TOOL_VERSION=$(gh_curl "${!TOOL_URL}" | jq --raw-output 'if type == "array" then ([ .[] | select(((.name // null) | type == "string") and (.name | contains("infra/module-swapper")) and ((.tag_name // null) | type == "string")) ][0].tag_name // empty) | ltrimstr("infra/module-swapper/v") else empty end' || true)
            elif [ "$tool" == "TFLINT_BP_PLUGIN" ]; then
              # get latest TFLINT_BP_PLUGIN release
              LATEST_TOOL_VERSION=$(gh_curl "${!TOOL_URL}" | jq --raw-output 'if type == "array" then ([ .[] | select(((.name // null) | type == "string") and (.name | contains("tflint-ruleset-blueprint")) and ((.tag_name // null) | type == "string")) ][0].tag_name // empty) | ltrimstr("tflint-ruleset-blueprint/v") else empty end' || true)
            elif [ "$tool" == "GATOR" ]; then
              # get latest GATOR_MINOR release
              LATEST_TOOL_VERSION=$(gh_curl "${!TOOL_URL}" | jq --raw-output --arg minor "${GATOR_MINOR}" 'if type == "array" then ([ .[] | select(((.name // null) | type == "string") and (.name | contains($minor)) and ((.tag_name // null) | type == "string")) ][0].tag_name // empty) | ltrimstr("v") else empty end' || true)
            elif [ "$tool" == "KUSTOMIZE" ]; then
              # get latest KUSTOMIZE release
              LATEST_TOOL_VERSION=$(gh_curl "${!TOOL_URL}" | jq --raw-output 'if type == "array" then ([ .[] | select(((.name // null) | type == "string") and (.name | contains("kustomize")) and ((.tag_name // null) | type == "string")) ][0].tag_name // empty) | ltrimstr("kustomize/v") else empty end' || true)
            else
              LATEST_TOOL_VERSION=$(gh_curl "${!TOOL_URL}" | jq --raw-output 'if type == "object" and ((.tag_name // null) | type == "string") then .tag_name | ltrimstr("v") else empty end' || true)
            fi
            echo "Current ${tool} version: ${CURRENT_TOOL_VERSION}"

            if [[ -z "$CURRENT_TOOL_VERSION" || "$CURRENT_TOOL_VERSION" == "null" || -z "$LATEST_TOOL_VERSION" || "$LATEST_TOOL_VERSION" == "null" ]]; then
              echo "${tool} version is missing"
              continue
            fi

            if [[ "$CURRENT_TOOL_VERSION" == *$'\n'* || "$CURRENT_TOOL_VERSION" == *$'\r'* || ! "$CURRENT_TOOL_VERSION" =~ $VERSION_REGEX ]]; then
              echo "::warning::Skipping ${tool}: current version string failed format validation"
              continue
            fi

            if [[ "$LATEST_TOOL_VERSION" == *$'\n'* || "$LATEST_TOOL_VERSION" == *$'\r'* || ! "$LATEST_TOOL_VERSION" =~ $VERSION_REGEX ]]; then
              echo "::warning::Skipping ${tool}: upstream version string failed format validation"
              continue
            fi

            echo "Latest ${tool} version: ${LATEST_TOOL_VERSION} via ${!TOOL_URL}"

            # update tool version in Makefile if not latest
            if [ "$CURRENT_TOOL_VERSION" == "$LATEST_TOOL_VERSION" ]; then
              echo "${tool} is latest"
            else
              echo "${tool} needs to be updated to ${LATEST_TOOL_VERSION}"
              TOOL_KEY="${tool}_VERSION" OLD_VER="${CURRENT_TOOL_VERSION}" NEW_VER="${LATEST_TOOL_VERSION}" \
                perl -i -pe '$c += s/^([ \t]*\Q$ENV{TOOL_KEY}\E[ \t]+:=[ \t]+)\Q$ENV{OLD_VER}\E([ \t]*(?:#.*)?)$/${1}$ENV{NEW_VER}${2}/; END { exit 1 unless $c }' infra/build/Makefile
              echo "BUMP_IMG=true" >> "$GITHUB_ENV"
              PR_UPDATE_BODY="${PR_UPDATE_BODY} Updating ${tool} from ${CURRENT_TOOL_VERSION} to ${LATEST_TOOL_VERSION} ${newline}"
            fi
          done

          # Create multiline PR body text
          if [ -n "$PR_UPDATE_BODY" ]; then
            EOF_DELIM="EOF_$(od -An -N16 -tx1 /dev/urandom | tr -d ' \n')"
            {
              echo "PR_UPDATE_BODY<<${EOF_DELIM}"
              echo "$PR_UPDATE_BODY"
              echo "${EOF_DELIM}"
            } >> "$GITHUB_ENV"
          fi
      - name: Bump image patch version
        if: env.BUMP_IMG == 'true'
        run: |
          CURRENT_IMG_VERSION=$(awk '{sub(/#.*/, "")} $1 == "DOCKER_TAG_VERSION_DEVELOPER_TOOLS" && $2 == ":=" && NF == 3 {print $3; exit}' infra/build/Makefile)
          if [[ ! "$CURRENT_IMG_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid DOCKER_TAG_VERSION_DEVELOPER_TOOLS format"
            exit 1
          fi
          NEW_IMG_VERSION=$(echo "$CURRENT_IMG_VERSION" | awk -F. '{$NF+=1; print $0}' OFS=".")
          TOOL_KEY="DOCKER_TAG_VERSION_DEVELOPER_TOOLS" OLD_VER="${CURRENT_IMG_VERSION}" NEW_VER="${NEW_IMG_VERSION}" \
            perl -i -pe '$c += s/^([ \t]*\Q$ENV{TOOL_KEY}\E[ \t]+:=[ \t]+)\Q$ENV{OLD_VER}\E([ \t]*(?:#.*)?)$/${1}$ENV{NEW_VER}${2}/; END { exit 1 unless $c }' infra/build/Makefile
          echo "NEW_IMG_VERSION=${NEW_IMG_VERSION}" >> "$GITHUB_ENV"
      - name: Commit Makefile
        if: env.BUMP_IMG == 'true'
        run: |
          git config user.name 'Cloud Foundation Bot'
          git config user.email 'cloud-foundation-bot@google.com'
          git add infra/build/Makefile
          git diff-index --quiet HEAD || git commit -m "chore: Update Tools to ${NEW_IMG_VERSION}"
      - name: Create Pull Request
        if: env.BUMP_IMG == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.CFT_ROBOT_PAT }}
          commit-message: Update tools to ${{env.NEW_IMG_VERSION}}
          committer: "Update Tooling Action <cloud-foundation-bot@google.com>"
          title: "chore: Update Tools to ${{env.NEW_IMG_VERSION}}"
          body: |
            Updated tools to ${{env.NEW_IMG_VERSION}}
            ${{env.PR_UPDATE_BODY}}
          labels: automated pr
          reviewers: bharathkkb, apeabody
          branch: create-pull-request/patch-tools-version
          base: main
