name: release-tflint

on:
  push:
    tags:
    - tflint-ruleset-blueprint/v*.*.*

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 'tflint-ruleset-blueprint'
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: 'tflint-ruleset-blueprint/go.mod'
    - run: echo "GORELEASER_CURRENT_TAG=${GITHUB_REF#refs/tags/tflint-ruleset-blueprint/}" >> $GITHUB_ENV
    - run: echo "$GORELEASER_CURRENT_TAG"
    - name: Run GoReleaser
      uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
      with:
        version: latest
        args: release --clean --skip=validate,publish
        workdir: tflint-ruleset-blueprint
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - name: upload
      run: |
          gh release upload "tflint-ruleset-blueprint/${GORELEASER_CURRENT_TAG}" dist/tflint-ruleset-blueprint_*.zip dist/checksums.txt --repo "${GITHUB_REPOSITORY}" --clobber
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
